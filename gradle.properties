# Gradle
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.r8.gradual.support=true
android.r8.maxWorkers=4
# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
# Kotlin
kotlin.code.style=official
# MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
# This host is linux-aarch64, which Kotlin/Native does not support. Without this flag
# Kotlin disables the *whole* publication of any module that declares native targets
# (coui-core, miuix-core, ...), so nothing can be published to mavenLocal at all.
# With it, publishing of the non-native targets (android/desktop/js/wasmJs) is allowed
# and the native ones are simply skipped.
kotlin.internal.mpp.allowMultiplatformPublicationsOnUnsupportedHost=true
# Native
kotlin.native.binary.smallBinary=true
kotlin.native.ignoreDisabledTargets=true
# Incremental compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.jvm.fir=true
kotlin.incremental.js=true
kotlin.incremental.js.klib=true
kotlin.incremental.native=true
kotlin.incremental.wasm=true
# Experimental target
org.jetbrains.compose.experimental.macos.enabled=true
# Xcode
kotlin.apple.xcodeCompatibility.nowarn=true
xcodeproj=./example/ios/iosApp.xcodeproj
